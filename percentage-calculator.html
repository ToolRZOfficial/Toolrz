<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolRz Percentage Calculator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #172033;
}

header {
  background: white;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #e5e7eb;
}

.logo {
  font-size: 30px;
  font-weight: bold;
}

.logo span {
  color: #2563eb;
}

.container {
  max-width: 650px;
  margin: 40px auto;
  padding: 20px;
}

.box {
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #64748b;
  margin-bottom: 30px;
}

.calculation {
  background: #f8fafc;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 20px;
}

.calculation h2 {
  font-size: 19px;
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin: 12px 0 6px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.result {
  display: none;
  margin-top: 20px;
  padding: 20px;
  background: #eef2ff;
  border-radius: 12px;
  text-align: center;
}

.answer {
  font-size: 25px;
  font-weight: bold;
}

.back {
  display: block;
  text-align: center;
  margin-top: 25px;
  color: #2563eb;
  text-decoration: none;
}
</style>
</head>

<body>

<header>
  <div class="logo">Tool<span>Rz</span></div>
</header>

<div class="container">

<div class="box">

<h1>Percentage Calculator</h1>

<p class="subtitle">
Calculate percentages quickly and easily.
</p>

<div class="calculation">

<h2>What is X% of Y?</h2>

<label>Percentage (%)</label>
<input type="number" id="percent1" placeholder="Example: 20">

<label>Number</label>
<input type="number" id="number1" placeholder="Example: 500">

<button id="button1">
Calculate
</button>

</div>

<div class="calculation">

<h2>What percentage is X of Y?</h2>

<label>Value</label>
<input type="number" id="number2" placeholder="Example: 50">

<label>Total</label>
<input type="number" id="number3" placeholder="Example: 200">

<button id="button2">
Calculate
</button>

</div>

<div class="result" id="result">
<h2>Result</h2>
<div class="answer" id="answer"></div>
</div>

<a class="back" href="index.html">
← Back to ToolRz
</a>

</div>
</div>

<script>

document.getElementById("button1").addEventListener("click", function() {

  var percentage =
    parseFloat(document.getElementById("percent1").value);

  var number =
    parseFloat(document.getElementById("number1").value);

  if (isNaN(percentage) || isNaN(number)) {
    alert("Please enter both values.");
    return;
  }

  var result =
    (percentage / 100) * number;

  document.getElementById("answer").textContent =
    percentage + "% of " + number + " = " + result;

  document.getElementById("result").style.display = "block";

});


document.getElementById("button2").addEventListener("click", function() {

  var value =
    parseFloat(document.getElementById("number2").value);

  var total =
    parseFloat(document.getElementById("number3").value);

  if (isNaN(value) || isNaN(total)) {
    alert("Please enter both values.");
    return;
  }

  if (total === 0) {
    alert("Total cannot be zero.");
    return;
  }

  var result =
    (value / total) * 100;

  document.getElementById("answer").textContent =
    value + " is " + result.toFixed(2) + "% of " + total;

  document.getElementById("result").style.display = "block";

});

</script>

</body>
</html>
