<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolRz Image Compressor</title>

<meta name="description" content="Compress your images online for free with ToolRz. Fast, simple and secure image compression.">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

header {
    background: white;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #e5e7eb;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.logo span {
    color: #2563eb;
}

.container {
    max-width: 700px;
    margin: 45px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 12px;
}

.subtitle {
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 25px;
}

input[type="file"] {
    width: 100%;
    padding: 14px;
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    background: #f8fafc;
    cursor: pointer;
}

.preview {
    max-width: 100%;
    max-height: 300px;
    margin: 25px auto;
    display: none;
    border-radius: 10px;
}

.controls {
    margin-top: 20px;
    display: none;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
}

input[type="range"] {
    width: 100%;
}

.quality-value {
    margin-top: 8px;
    color: #2563eb;
    font-weight: bold;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.result {
    display: none;
    margin-top: 25px;
    padding: 18px;
    background: #f1f5f9;
    border-radius: 12px;
}

.result p {
    margin: 7px 0;
}

.download {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 20px;
    background: #16a34a;
    color: white;
    text-decoration: none;
    border-radius: 9px;
    font-weight: bold;
}

.back {
    display: inline-block;
    margin-top: 25px;
    color: #2563eb;
    text-decoration: none;
}

footer {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

@media (max-width: 600px) {
    h1 {
        font-size: 27px;
    }

    .box {
        padding: 22px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Tool<span>Rz</span></div>
</header>

<div class="container">

    <div class="box">

        <h1>Image Compressor</h1>

        <p class="subtitle">
            Compress your images online for free.
            Your image is processed directly in your browser.
        </p>

        <input type="file" id="imageInput" accept="image/*">

        <img id="preview" class="preview">

        <div class="controls" id="controls">

            <label for="quality">
                Compression Quality
            </label>

            <input
                type="range"
                id="quality"
                min="10"
                max="100"
                value="70"
            >

            <div class="quality-value">
                Quality: <span id="qualityValue">70</span>%
            </div>

            <button onclick="compressImage()">
                Compress Image
            </button>

        </div>

        <div class="result" id="result">

            <p>
                <strong>Original Size:</strong>
                <span id="originalSize"></span>
            </p>

            <p>
                <strong>Compressed Size:</strong>
                <span id="compressedSize"></span>
            </p>

            <p>
                <strong>Reduction:</strong>
                <span id="reduction"></span>
            </p>

            <a
                id="download"
                class="download"
                download="toolrz-compressed-image.jpg"
            >
                Download Compressed Image
            </a>

        </div>

        <a class="back" href="index.html">
            ← Back to ToolRz
        </a>

    </div>

</div>

<footer>
    © 2026 ToolRz — Free Online Tools
</footer>

<script>

let selectedFile = null;

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const controls = document.getElementById("controls");
const quality = document.getElementById("quality");
const qualityValue = document.getElementById("qualityValue");

quality.addEventListener("input", function() {
    qualityValue.textContent = quality.value;
});

imageInput.addEventListener("change", function(event) {

    selectedFile = event.target.files[0];

    if (!selectedFile) {
        return;
    }

    const imageURL = URL.createObjectURL(selectedFile);

    preview.src = imageURL;
    preview.style.display = "block";

    controls.style.display = "block";

    document.getElementById("result").style.display = "none";
});

function formatSize(bytes) {

    if (bytes < 1024) {
        return bytes + " Bytes";
    }

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(2) + " KB";
    }

    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

function compressImage() {

    if (!selectedFile) {
        alert("Please select an image first.");
        return;
    }

    const img = new Image();

    img.onload = function() {

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img, 0, 0);

        const compressionQuality =
            Number(quality.value) / 100;

        canvas.toBlob(function(blob) {

            if (!blob) {
                alert("Compression failed. Please try another image.");
                return;
            }

            const downloadURL =
                URL.createObjectURL(blob);

            document.getElementById("originalSize").textContent =
                formatSize(selectedFile.size);

            document.getElementById("compressedSize").textContent =
                formatSize(blob.size);

            const reduction =
                ((selectedFile.size - blob.size) /
                selectedFile.size) * 100;

            document.getElementById("reduction").textContent =
                Math.max(0, reduction).toFixed(1) + "%";

            const download =
                document.getElementById("download");

            download.href = downloadURL;

            document.getElementById("result").style.display =
                "block";

        }, "image/jpeg", compressionQuality);

    };

    img.src = URL.createObjectURL(selectedFile);
}

</script>

</body>
</html>
