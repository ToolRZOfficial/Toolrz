<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolRz YouTube Description Generator</title>

<meta name="description" content="Generate YouTube video descriptions instantly with ToolRz.">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

header {
    background: white;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #e5e7eb;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.logo span {
    color: #2563eb;
}

.container {
    max-width: 750px;
    margin: 40px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    line-height: 1.5;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input,
textarea,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
    font-family: Arial, sans-serif;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.field {
    margin-top: 18px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.result {
    display: none;
    margin-top: 25px;
}

.result-box {
    background: #f8fafc;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    white-space: pre-wrap;
    line-height: 1.6;
}

.copy {
    background: #172033;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #2563eb;
    text-decoration: none;
}

footer {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

@media (max-width: 600px) {
    .box {
        padding: 20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Tool<span>Rz</span></div>
</header>

<div class="container">

<div class="box">

<h1>YouTube Description Generator</h1>

<p class="subtitle">
Create a ready-to-use YouTube video description in seconds.
</p>

<div class="field">

<label for="topic">Video Topic</label>

<input
id="topic"
type="text"
placeholder="Example: Easy Chicken Biryani Recipe"
>

</div>

<div class="field">

<label for="details">Video Details</label>

<textarea
id="details"
placeholder="Tell us briefly what your video is about..."
></textarea>

</div>

<div class="field">

<label for="style">Description Style</label>

<select id="style">

<option value="professional">Professional</option>
<option value="friendly">Friendly</option>
<option value="short">Short & Simple</option>
<option value="seo">SEO Focused</option>

</select>

</div>

<button id="generate">
Generate Description
</button>

<div class="result" id="result">

<h2>Your YouTube Description</h2>

<div class="result-box" id="description"></div>

<button class="copy" id="copy">
Copy Description
</button>

</div>

<a class="back" href="index.html">
← Back to ToolRz
</a>

</div>
</div>

<footer>
© 2026 ToolRz — Free Online Tools
</footer>

<script>

var topic =
document.getElementById("topic");

var details =
document.getElementById("details");

var style =
document.getElementById("style");

var result =
document.getElementById("result");

var description =
document.getElementById("description");


document.getElementById("generate").addEventListener("click", function() {

    var videoTopic =
        topic.value.trim();

    var videoDetails =
        details.value.trim();

    if (!videoTopic) {
        alert("Please enter your video topic.");
        return;
    }

    if (!videoDetails) {
        alert("Please enter your video details.");
        return;
    }

    var text = "";

    if (style.value === "professional") {

        text =
        "Welcome to our video about " +
        videoTopic +
        ".\n\n" +
        videoDetails +
        "\n\n" +
        "In this video, we cover the important details you need to know about " +
        videoTopic +
        ". Watch until the end for useful information and practical tips.\n\n" +
        "If you found this video helpful, please like the video, subscribe to the channel, and share it with others.\n\n" +
        "Thanks for watching!";

    } else if (style.value === "friendly") {

        text =
        "Hey everyone! 👋\n\n" +
        "Today we're talking about " +
        videoTopic +
        "!\n\n" +
        videoDetails +
        "\n\n" +
        "I hope you enjoy this video and find it useful. Don't forget to like, subscribe, and share! ❤️\n\n" +
        "Thanks for watching and see you in the next video!";

    } else if (style.value === "short") {

        text =
        videoTopic +
        "\n\n" +
        videoDetails +
        "\n\n" +
        "If you enjoyed this video, don't forget to like, subscribe, and share.\n\n" +
        "Thanks for watching!";

    } else {

        text =
        "In this video, we explore " +
        videoTopic +
        " and share useful information, tips, and details.\n\n" +
        videoDetails +
        "\n\n" +
        "This video is designed to help you better understand " +
        videoTopic +
        " and learn the key points quickly and easily.\n\n" +
        "Watch the complete video for all the details.\n\n" +
        "Don't forget to LIKE 👍, SUBSCRIBE 🔔, and SHARE this video.\n\n" +
        "Thanks for watching!\n\n" +
        "#" +
        videoTopic
            .replace(/[^a-zA-Z0-9]+/g, "")
            .substring(0, 30) +
        " #YouTube #Video";
    }

    description.textContent =
        text;

    result.style.display =
        "block";

});


document.getElementById("copy").addEventListener("click", function() {

    navigator.clipboard.writeText(
        description.textContent
    );

    this.textContent =
        "Copied!";

    setTimeout(function() {

        document.getElementById("copy").textContent =
            "Copy Description";

    }, 1200);

});

</script>

</body>
</html>
