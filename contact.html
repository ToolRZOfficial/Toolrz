<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us - ToolRz</title>

<meta name="description" content="Contact ToolRz for questions, feedback, or suggestions about our online tools.">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
    line-height: 1.7;
}

header {
    background: white;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #e5e7eb;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.logo span {
    color: #2563eb;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.intro {
    text-align: center;
    color: #64748b;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
    margin-bottom: 7px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font-size: 16px;
    font-family: Arial, sans-serif;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.note {
    margin-top: 20px;
    padding: 15px;
    background: #f1f5f9;
    border-radius: 10px;
    font-size: 14px;
    color: #64748b;
}

.back {
    display: block;
    text-align: center;
    margin-top: 30px;
    color: #2563eb;
    text-decoration: none;
}

footer {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

@media (max-width: 600px) {
    .box {
        padding: 22px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Tool<span>Rz</span></div>
</header>

<div class="container">

<div class="box">

<h1>Contact Us</h1>

<p class="intro">
Have a question, suggestion, or feedback about ToolRz?
Send us a message.
</p>

<form id="contactForm">

<label for="name">Your Name</label>

<input
type="text"
id="name"
placeholder="Enter your name"
required
>

<label for="email">Your Email</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
>

<label for="message">Your Message</label>

<textarea
id="message"
placeholder="Write your message here..."
required
></textarea>

<button type="submit">
Send Message
</button>

</form>

<div class="note">
Your email app will open when you submit the form. You can then send the message directly.
</div>

<a class="back" href="index.html">
← Back to ToolRz
</a>

</div>
</div>

<footer>
© 2026 ToolRz — Free Online Tools
</footer>

<script>

document.getElementById("contactForm").addEventListener("submit", function(event) {

    event.preventDefault();

    var name =
        document.getElementById("name").value.trim();

    var email =
        document.getElementById("email").value.trim();

    var message =
        document.getElementById("message").value.trim();

    var subject =
        encodeURIComponent(
            "ToolRz Contact - " + name
        );

    var body =
        encodeURIComponent(
            "Name: " + name +
            "\nEmail: " + email +
            "\n\nMessage:\n" + message
        );

    window.location.href =
        "mailto:?subject=" +
        subject +
        "&body=" +
        body;

});

</script>

</body>
</html>
