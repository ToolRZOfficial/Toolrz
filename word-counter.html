<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolRz Word Counter</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 20px;
}

.box {
    max-width: 700px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    text-align: center;
}

textarea {
    width: 100%;
    height: 250px;
    padding: 15px;
    font-size: 16px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 10px;
}

.stats {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.stat {
    background: #f1f5f9;
    padding: 15px;
    text-align: center;
    border-radius: 10px;
}

.number {
    font-size: 25px;
    font-weight: bold;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: #2563eb;
    color: white;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #2563eb;
}
</style>
</head>

<body>

<div class="box">

<h1>ToolRz Word Counter</h1>

<p>Type or paste your text below.</p>

<textarea id="text" placeholder="Write or paste text here..."></textarea>

<div class="stats">

<div class="stat">
<div class="number" id="words">0</div>
Words
</div>

<div class="stat">
<div class="number" id="characters">0</div>
Characters
</div>

<div class="stat">
<div class="number" id="nospace">0</div>
Without Spaces
</div>

<div class="stat">
<div class="number" id="sentences">0</div>
Sentences
</div>

</div>

<button onclick="clearText()">Clear Text</button>

<a class="back" href="index.html">← Back to ToolRz</a>

</div>

<script>

var text = document.getElementById("text");

text.addEventListener("input", function() {

    var value = text.value;

    var trimmed = value.trim();

    var wordCount = 0;

    if (trimmed.length > 0) {
        wordCount = trimmed.split(/\s+/).length;
    }

    document.getElementById("words").textContent = wordCount;

    document.getElementById("characters").textContent = value.length;

    document.getElementById("nospace").textContent =
        value.replace(/\s/g, "").length;

    var sentenceMatches = value.match(/[.!?]+/g);

    document.getElementById("sentences").textContent =
        sentenceMatches ? sentenceMatches.length : 0;
});

function clearText() {

    text.value = "";

    document.getElementById("words").textContent = "0";
    document.getElementById("characters").textContent = "0";
    document.getElementById("nospace").textContent = "0";
    document.getElementById("sentences").textContent = "0";
}

</script>

</body>
</html>
